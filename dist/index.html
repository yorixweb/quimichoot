<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quimichoot</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="shell split-home">
      <section class="home-panel menu-panel">
        <p class="eyebrow">Actividad de química</p>
        <h1>Quimichoot</h1>
        <p class="lead">Elige cómo quieres entrar a la partida.</p>
        <div class="home-actions menu-actions">
          <a class="button primary menu-button" href="./play/">
            <span>Unirse a sala</span>
            <small>Entrar con el PIN del profesor</small>
          </a>
          <a class="button secondary menu-button" href="./host/">
            <span>Crear sala</span>
            <small>Configurar rondas y comenzar el juego</small>
          </a>
        </div>
      </section>
      <section class="molecule-mark" aria-label="Molécula decorativa">
        <span></span><span></span><span></span><span></span><span></span>
      </section>
    </main>
  </body>
</html>
